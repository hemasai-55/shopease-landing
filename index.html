<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopease</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<header>
  <h1 class="logo">Shopease</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
  </nav>
</header>

<!-- Hero Section -->
<section class="hero">
  <h2>Shop Smart, Shop Easy</h2>
  <p>Best deals on electronics, fashion & more</p>
  <button onclick="shopNow()">Shop Now</button>
</section>

<!-- Products Section -->
<section class="products">
  <h2>Featured Products</h2>

  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Smartphone</h3>
    <p>₹15,999</p>
    <button>Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Shoes</h3>
    <p>₹2,999</p>
    <button>Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150">
    <h3>Headphones</h3>
    <p>₹1,499</p>
    <button>Add to Cart</button>
  </div>

</section>

<!-- Footer -->
<footer>
  <p>© 2026 Shopease. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
